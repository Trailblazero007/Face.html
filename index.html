<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Face Recreation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #171717;
      font-family: Arial, sans-serif;
    }

    /* The yellow face is the main container for every facial feature. */
    .face {
      position: relative;
      width: min(326px, 90vw);
      aspect-ratio: 326 / 406;
      background: #ffff00;
    }

    .eye {
      position: absolute;
      top: 5.9%;
      width: 36.8%;
      height: 29.6%;
      background: #fff;
    }

    .eye-left {
      left: 7.4%;
    }

    .eye-right {
      right: 16%;
    }

    .pupil {
      position: absolute;
      top: 20%;
      left: 20%;
      width: 40%;
      height: 40%;
      background: #000;
    }

    .mouth {
      position: absolute;
      left: 7.4%;
      top: 41.4%;
      width: 81%;
      height: 47.3%;
      background: #000;
    }

    .teeth {
      position: absolute;
      top: 12%;
      left: 4.5%;
      right: 4.5%;
      display: flex;
      justify-content: space-between;
      gap: 4%;
    }

    .tooth {
      flex: 1;
      height: 12%;
      aspect-ratio: 1;
      background: #fff;
    }

    .tongue {
      position: absolute;
      bottom: 1.5%;
      width: 21.2%;
      height: 44%;
      background: #ff0000;
    }

    .tongue-left {
      left: 27.3%;
    }

    .tongue-right {
      right: 27.3%;
    }

    @media (max-width: 360px) {
      .face {
        width: 90vw;
      }
    }
  </style>
</head>
<body>
  <main class="face" aria-label="A geometric yellow face with square eyes, a black mouth, white teeth, and a red tongue">
    <div class="eye eye-left"><div class="pupil"></div></div>
    <div class="eye eye-right"><div class="pupil"></div></div>

    <div class="mouth">
      <div class="teeth" aria-hidden="true">
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
        <div class="tooth"></div>
      </div>
      <div class="tongue tongue-left"></div>
      <div class="tongue tongue-right"></div>
    </div>
  </main>
</body>
</html>
